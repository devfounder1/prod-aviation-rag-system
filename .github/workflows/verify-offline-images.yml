name: Verify prepared offline images
on:
  push:
    branches: [release]
    paths: ['.github/workflows/verify-offline-images.yml', 'packaging/windows/verify_prepared_images.py']
  workflow_dispatch:
    inputs:
      components_run:
        description: Source component preparation workflow run ID
        default: '44722421779'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64-local-images
          path: dist/linux-images
          github-token: ${{ github.token }}
          run-id: ${{ inputs.components_run || '44722421779' }}
      - name: Verify exact input and execute isolated checks
        run: |
          sha256sum -c dist/linux-images/SHA256SUMS.txt
          docker load -i dist/linux-images/butuz-documents.tar
          docker load -i dist/linux-images/butuz-sandbox.tar
          python packaging/windows/verify_prepared_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: offline-image-checks
          path: dist/offline-image-checks.json
          retention-days: 7
