name: Offline application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Strict types for newly hardened modules
        run: uv run mypy --strict --follow-imports=silent chat_store.py routing.py jobs.py file_tools.py agent_files_ui.py doctor.py logging_config.py vision.py retrieval_policy.py answer_prompts.py assistant_identity.py activity.py ui_components.py ui_dispatch.py cancellable_http.py llm_client.py file_validation.py file_receipts.py ai_agent.py sandbox_runner.py document_inspection.py gost_formatter.py document_layout.py document_runner.py document_jobs.py document_approval_ui.py standard_profiles.py document_elements.py table_pagination.py metafile_layout.py
      - name: Syntax-check desktop integration
        run: uv run python -m py_compile prilozhenie.py smart_rag.py ai_agent.py document_runtime/worker.py
