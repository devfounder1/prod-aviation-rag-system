name: Windows launcher and assembly scripts
on:
  push:
    branches: [release]
    paths: ['packaging/windows/**', 'windows_entry.py', 'tests/test_windows_portable.py', '.github/workflows/windows-handoff.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse PowerShell and compile fixed x64 launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem packaging/windows/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          New-Item dist -ItemType Directory | Out-Null
          $source = (Resolve-Path 'packaging\windows\Launcher.cs').Path
          $target = Join-Path (Resolve-Path 'dist').Path 'BUTUZIK.AI.exe'
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /reference:System.Windows.Forms.dll ("/out:" + $target) $source
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }
      - name: Test portable logic without models or private data
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/test_windows_portable.py
      - name: Upload launcher only (not a complete offline application)
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-launcher-only-assembly-required
          path: dist/BUTUZIK.AI.exe
