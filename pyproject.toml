[project]
name = "butuz-ai"
version = "0.2.0"
description = "Offline desktop assistant with local RAG and tools"
requires-python = ">=3.11,<3.14"
dependencies = [
  "flet[cli,desktop]>=0.25,<0.29", "langchain-openai>=0.3,<1.0",
  "langchain-huggingface>=0.1,<1.0", "langchain-chroma>=0.2,<1.0",
  "langchain-community>=0.3,<1.0", "langgraph>=0.2,<1.0",
  "sentence-transformers>=3,<6", "chromadb>=0.5,<2",
  "python-docx>=1.1", "PyPDF2>=3", "pypdf>=5", "pdfplumber>=0.11",
  "pydantic-settings>=2.5", "rank-bm25>=0.2", "pandas>=2",
  "openpyxl>=3", "requests>=2", "sounddevice>=0.5", "faster-whisper>=1",
]
[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
